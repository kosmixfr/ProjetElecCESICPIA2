; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:uno]
platform = atmelavr
board = uno
framework = arduino
; -flto : optimisation a l'edition de liens, indispensable ici
; (projet a 99.8% de flash, chaque correctif faisait deborder).
; -mcall-prologues : factorise prologues/epilogues (gain taille specifique AVR).
build_flags = -flto -Os -mcall-prologues
upload_port = /dev/ttyACM1
monitor_port = /dev/ttyACM1
monitor_speed = 9600
lib_deps = 
	adafruit/RTClib@^2.1.4
	adafruit/Adafruit BME280 Library@^2.3.0
	seeed-studio/Grove - Chainable RGB LED@^1.0.0
	arduino-libraries/SD@^1.3.0
	mikalhart/TinyGPSPlus@^1.1.0

; Variante sans horloge RTC : horloge fictive interne (cf. SANS_RTC).
; Compiler/injecter avec : pio run -e uno_sans_rtc -t upload
[env:uno_sans_rtc]
extends = env:uno
build_flags = -flto -Os -mcall-prologues -DSANS_RTC
